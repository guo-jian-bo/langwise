  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: any

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/txt/source_license.txt
    - assets/images/
    - assets/images/splash/launch_image.png
    - assets/images/splash/
    - assets/images/logo/
    - assets/images/practice_questions/
    - assets/images/sign_in_up/
    - assets/images/elements/
    - assets/images/official_course_details/
    - assets/images/custom_course/
    - assets/images/manager/
    - assets/images/user_center/
    - assets/images/mission/
    - assets/images/public/
    - assets/images/application/
    - assets/svg/manage/
    - assets/svg/photographing_books/
    - assets/svg/practice_questions/
    - assets/svg/exam_plan/
    - assets/svg/custom_course/
    - assets/svg/public/
    - assets/svg/membership_card/
    - assets/svg/today_plan/
    - assets/svg/official_course_details/
    - assets/svg/guided_settings/
    - assets/svg/elements/
    - assets/svg/user_center/
    - assets/svg/image_moderation/
    - assets/svg/mission/
    - assets/language_json/
    - assets/svg/
    - assets/lottie/
    - assets/audios/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: LangWiseFont
      fonts:
        - asset: assets/fonts/LangWise-Bold.otf
          weight: 700
        - asset: assets/fonts/LangWise-Medium.otf
          weight: 500
        - asset: assets/fonts/LangWise-Regular.otf
          weight: 400

    - family: AndikaRegular
      fonts:
        - asset: assets/fonts/Andika-Regular.ttf
          weight: 400

    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4-Light.ttf
          weight: 300
        - asset: assets/fonts/SourceSerif4-Medium.ttf
          weight: 400
        - asset: assets/fonts/SourceSerif4-Regular.ttf
          weight: 500
        - asset: assets/fonts/SourceSerif4-SemiBold.ttf
          weight: 600

    - family: LXGWWenKaiGBScreen
      fonts:
        - asset: assets/fonts/LXGWWenKaiGBScreen.ttf
          weight: 300
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages

tobias:
  # 支付宝插件使用的自定义协议配置
  url_scheme: langwise
  ios:
    # iOS 端支付宝回跳相关配置
    ignore_security: true
    universal_link: https://timelywise.cn/alipay/

fluwx:
  no_pay: true

msix_config:
  # Windows 安装包显示名称
  display_name: LangWise
  # Windows MSIX 包版本号，需符合 a.b.c.d 格式
  msix_version: 2.0.6.0
  # 注册可激活应用的协议，支持 https 和 langwise://
  protocol_activation: https, langwise
  # 注册 https web-to-app 可唤起的域名
  app_uri_handler_hosts: timelywise.cn
